stages:
  - build
  - push
  - deploy

build_job:
  stage: build
  script:
     - docker build -t text-util:latest .
  tags:
     - dev

push_job:
  stage: push 
  script:
     - docker login -u $DOCKERHUB_USER -p $DOCKERHUB_PASS
     - docker image tag text-util:latest $DOCKERHUB_USER/text-util:latest
     - docker push $DOCKERHUB_USER/text-util:latest
  tags:
     - dev

deploy_job:
  stage: deploy
  script:
     - docker-compose up -d
  tags:
     - dev
